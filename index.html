<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZwiZo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--ink:#f2f4f2;--mute:#9aa29d;--line:#262a27;--acc:#33ff1a;--neon:#33ff1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:18px 0}
.logo{font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:.12em}
nav{display:flex;gap:4px;flex-wrap:wrap;order:3;width:100%}
@media(min-width:860px){nav{order:0;width:auto}}
nav button{background:none;border:0;border-bottom:2.5px solid transparent;color:var(--mute);padding:6px 12px;font-weight:500}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--acc)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 11px;font-size:13px;font-weight:500;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--neon);color:#0b0b0b}
.btn{background:var(--acc);color:#0b0b0b;border:0;border-radius:8px;padding:10px 18px;font-weight:500;text-decoration:none;display:inline-block}
.cartbtn{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:99px;padding:8px 18px}
h1.pt{font:800 clamp(32px,6vw,56px)/1.05 "Bricolage Grotesque",sans-serif;margin:20px 0 8px;max-width:14ch}
.sub{color:var(--mute);margin:0 0 24px;max-width:56ch}
.hero{display:grid;grid-template-columns:1fr;background:#0b0b0b;color:#fff;margin:0;min-height:calc(100svh - 72px)}
@media(min-width:800px){.hero{grid-template-columns:1fr 1fr}}
.hp{order:-1;aspect-ratio:1027/485;background:#1a1a1a center/cover no-repeat;background-image:linear-gradient(135deg,#2a2a2a,#0e0e0e)}
@media(min-width:800px){.hp{order:0;position:absolute;inset:0;aspect-ratio:auto;background-position:60% center}.hp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,11,.92) 0%,rgba(11,11,11,.72) 40%,rgba(11,11,11,0) 70%)}.hero{position:relative;display:flex;align-items:center}.hl{position:relative;z-index:1;max-width:620px}}
.hl{padding:36px max(20px,4vw);display:flex;flex-direction:column;justify-content:center;gap:18px}
.kick{color:var(--neon);font-weight:500;font-size:13px;letter-spacing:.15em;margin:0;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:28px;height:2px;background:var(--neon)}
.big{margin:0;font:800 clamp(52px,9vw,100px)/.95 "Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column}
.big .o{color:transparent;-webkit-text-stroke:2px #fff}
.big .g{color:var(--neon)}
.big span:empty{display:none}
.hl p.d{color:#b4b8b4;margin:0;max-width:38ch}
.cta{background:var(--neon);color:#0b0b0b;border:0;padding:16px 22px;font-weight:700;letter-spacing:.08em;text-align:start}
.layout{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:800px){.layout{grid-template-columns:1fr 190px}.filters{order:2;position:sticky;top:16px;align-self:start}}
.filters{background:#121513;border:1px solid var(--line);border-radius:10px;padding:14px}
.filters h2{font:500 17px "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.filters div{display:flex;flex-wrap:wrap;gap:6px}
@media(min-width:800px){.filters div{flex-direction:column;gap:2px}}
.chip{background:none;border:1.5px solid var(--line);border-radius:99px;color:var(--ink);padding:5px 14px;text-align:start}
@media(min-width:800px){.chip{border-color:transparent;border-radius:6px}}
.chip[aria-pressed="true"]{background:var(--neon);color:#0b0b0b;border-color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding-bottom:40px;align-content:start}
.item,.card{background:#121513;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;display:flex;align-items:flex-end;padding:12px}
.pic span{background:rgba(255,255,255,.88);color:#16211d;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:500}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3,.card h3{font:500 19px "Bricolage Grotesque",sans-serif;margin:0}
.sz{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:500}
.price s{color:var(--mute);font-weight:400;margin-inline-start:6px}
.card{padding:18px;gap:6px}
.date{color:var(--acc);font-weight:500;font-size:14px}
.empty{grid-column:1/-1;color:var(--mute)}
.panel{padding-bottom:40px;max-width:640px}
.panel p{margin:0 0 12px}
.hide{display:none!important}
aside{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(380px,100%);background:#121513;border-inline-start:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;display:flex;flex-direction:column;z-index:5}
[dir="rtl"] aside{transform:translateX(-100%)}
aside.open,[dir="rtl"] aside.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
aside h2{font:800 28px "Bricolage Grotesque",sans-serif;margin:0}
.close{align-self:flex-end;background:none;border:0;color:var(--ink)}
#lines{flex:1;overflow:auto;margin:16px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line button{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0}
.order{display:block;text-align:center;margin-top:8px}
.order[aria-disabled="true"]{opacity:.4;pointer-events:none}
footer{padding:24px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line);background:#121513}
footer p{margin:0 0 6px}
footer a{color:var(--ink);font-weight:500}
.contact{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:10px}
.sec{padding:56px 0 8px}
.sec h2{font:800 clamp(30px,5vw,48px)/1 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.cols{grid-template-columns:repeat(2,1fr)}}
.cols .pic{aspect-ratio:3/4}
.new{background:var(--neon);color:#0b0b0b;font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;align-self:flex-start}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 0 56px}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{min-height:220px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(135deg,#1c211e,#101311);color:var(--ink);font:800 clamp(28px,4vw,44px) "Bricolage Grotesque",sans-serif;display:flex;align-items:flex-end;justify-content:space-between;padding:20px;text-align:start}
.tile:hover{border-color:var(--neon)}
.tile span{color:var(--neon);font-size:24px}
.hero{direction:ltr}
[dir="rtl"] .hl{direction:rtl}
.ticker{background:var(--neon);color:#0b0b0b;overflow:hidden;white-space:nowrap;direction:ltr}
.trk{display:inline-flex;animation:tk 28s linear infinite}
.trk>span,.trk>i{font:800 clamp(16px,2.4vw,22px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;padding:14px 18px;font-style:normal}
[dir="rtl"] .trk>span{letter-spacing:0}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.trk{animation:none}}
.signup{padding:48px 0 32px;border-top:1px solid var(--line)}
.signup h2{font:800 clamp(28px,4.5vw,44px)/1 "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.signup p{color:var(--mute);margin:0 0 18px;max-width:46ch}
#sub{display:flex;gap:10px;flex-wrap:wrap;max-width:560px}
#sub input{flex:1;min-width:200px;background:#121513;border:1.5px solid var(--line);color:var(--ink);padding:14px;font:inherit;border-radius:0}
#sub input:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
#subMsg{margin:12px 0 0;color:var(--neon)}
#schips{flex-direction:row!important;flex-wrap:wrap;gap:6px!important}
#schips .chip{border-color:var(--line);border-radius:6px;padding:4px 10px}
#schips .chip[aria-pressed="true"]{border-color:var(--neon)}
#price{width:100%;accent-color:var(--neon)}
#pv{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ZwiZo</div>
    <nav id="nav" aria-label="Menu"></nav>
    <div class="tools">
      <div class="lang" id="lang" role="group" aria-label="Langue / Language / اللغة">
        <button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button>
      </div>
      <button class="cartbtn" id="open"><span data-t="cart"></span> (<span id="n">0</span>)</button>
    </div>
  </header>

</div>
  <section class="hero" id="home">
    <div class="hl">
      <p class="kick" data-t="tag"></p>
      <h1 class="big"><span class="o" data-t="w1"></span><span data-t="w2"></span><span class="g" data-t="w3"></span></h1>
      <p class="d" data-t="desc"></p>
      <button class="cta" data-v="articles" data-t="cta"></button>
    </div>
    <div class="hp" id="photo" role="img" aria-label="ZwiZo - No risk no fun"></div>
  </section>

<div class="ticker" id="ticker" aria-hidden="true"></div>
<div class="wrap">
  <div id="homeMore">
    <section class="sec"><h2 data-t="dropT"></h2><p class="sub" data-t="dropS"></p><div class="cols" id="drop"></div></section>
    <section class="sec"><h2 data-t="shopBy"></h2><div class="tiles" id="tiles"></div></section>
  </div>
  <div id="head"><h1 class="pt" id="title"></h1><p class="sub" id="sub"></p></div>

  <div class="layout" id="shop">
    <section class="filters" id="filters"><h2 data-t="gender"></h2><div id="gchips"></div><h2 data-t="filter" style="margin-top:14px"></h2><div id="chips"></div><h2 data-t="sizeT" style="margin-top:14px"></h2><div id="schips"></div><h2 data-t="priceT" style="margin-top:14px"></h2><div><input id="price" type="range" min="50" max="300" step="10" value="300" aria-label="Prix"><output id="pv"></output></div></section>
    <main class="grid" id="grid"></main>
  </div>
  <section class="grid" id="events"></section>
  <section class="panel" id="about"><p data-t="p1"></p><p data-t="p2"></p></section>

  <section class="signup"><h2 data-t="subT"></h2><p data-t="subS"></p><form id="sub"><input id="mail" type="email" required autocomplete="email"><button class="cta" type="submit" data-t="subBtn"></button></form><p id="subMsg" role="status"></p></section>
  <footer>
    <p data-t="f1"></p>
    <p data-t="f2"></p>
    <div class="contact">
      <a href="mailto:isakbesbes09@gmail.com">isakbesbes09@gmail.com</a>
      <a href="tel:+21694088649" dir="ltr">94 088 649</a>
      <a href="https://www.instagram.com/zwizo.kach" target="_blank" rel="noopener">Instagram : ZwiZo.kach</a>
    </div>
  </footer>
</div>

<aside id="cart" aria-label="Panier">
  <button class="close" id="close" data-t="close"></button>
  <h2 data-t="cartTitle"></h2>
  <div id="lines"></div>
  <p><strong><span data-t="total"></span> : <span id="total">0</span> TND</strong></p>
  <a class="btn order" id="order" href="#" target="_blank" rel="noopener" aria-disabled="true" data-t="order"></a>
</aside>
